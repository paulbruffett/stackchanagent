; M5StackChan Kawaii firmware — agentic refactor
; Board: M5Stack-CoreS3 (ESP32-S3, 16MB flash, 8MB PSRAM)

[env:m5stack-cores3]
platform = espressif32@^6.7.0
board = m5stack-cores3
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified@^0.2.0
    meganetaaan/M5Stack-Avatar@^0.10.0
    ; Servos on the Kawaii base are Feetech SCS (serial bus, GPIO 6/7
    ; @ 1 Mbaud), not PWM hobby servos — we drive them directly via
    ; HardwareSerial in src/servos.cpp, no library needed.
