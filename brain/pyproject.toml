[project]
name = "stackchan-brain"
version = "0.1.0"
description = "Jetson-side agent for the M5StackChan refactor"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "anthropic>=0.40.0",
    "zeroconf>=0.131.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 2+: STT and TTS. Heavy installs; keep optional during early phases.
voice = [
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "numpy>=1.26",
]
# Phase 4+: vision.
vision = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
