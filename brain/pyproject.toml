[project]
name = "stackchan-brain"
version = "0.1.0"
description = "Jetson-side agent for the M5StackChan refactor"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "anthropic>=0.40.0",
    "zeroconf>=0.131.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    # Face detection uses OpenCV's bundled Haar cascade — no extra model
    # download, no mediapipe. headless variant: no GUI libs, avoids
    # libavdevice collision with faster-whisper's `av` (PyAV) dependency.
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
# Brain is a flat collection of scripts run directly with .venv/bin/python;
# we install for the dependency tree, not to ship a package.
py-modules = []

[tool.uv.sources]
# Pin ctranslate2 to a locally-built CUDA wheel on the Jetson (aarch64 Linux).
# On Mac (platform_machine='arm64') the marker is false and uv resolves to
# PyPI's CPU wheel as usual. List form is required for the marker to apply —
# the single-dict form is treated as unconditional. The wheel itself is
# gitignored — see brain/wheels/README.md for the rebuild recipe.
ctranslate2 = [
  { path = "wheels/ctranslate2-4.7.2-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
