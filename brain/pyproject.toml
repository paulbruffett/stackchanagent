[project]
name = "stackchan-brain"
version = "0.1.0"
description = "Jetson-side agent for the M5StackChan refactor"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "anthropic>=0.40.0",
    "zeroconf>=0.131.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    # Declared as a direct dep (even though faster-whisper pulls it in
    # transitively) so the [tool.uv.sources] path pin below applies. uv only
    # overrides sources for packages listed in [project.dependencies].
    "ctranslate2>=4.7",
    "piper-tts>=1.2.0",
    # Face detection uses OpenCV's bundled Haar cascade — no extra model
    # download, no mediapipe. headless variant: no GUI libs, avoids
    # libavdevice collision with faster-whisper's `av` (PyAV) dependency.
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
# Brain is a flat collection of scripts run directly with .venv/bin/python;
# we install for the dependency tree, not to ship a package.
py-modules = []

[tool.uv.sources]
# Pin ctranslate2 to a locally-built CUDA wheel. PyPI's wheel is CPU-only,
# so on the Jetson we must use our own CUDA build (see brain/wheels/README.md).
#
# This pin is *unconditional* — uv 0.11 silently ignores `marker = ...` on
# path sources, so we can't conditionally swap between local wheel (Jetson)
# and PyPI (Mac). Since brain runs on the Jetson now, Mac `uv sync` would
# need the wheel file dropped into wheels/ as well. Hobbyist single-device
# project; not worth a more elaborate setup.
ctranslate2 = { path = "wheels/ctranslate2-4.7.2-cp312-cp312-linux_aarch64.whl" }

[tool.ruff]
line-length = 100
target-version = "py311"
